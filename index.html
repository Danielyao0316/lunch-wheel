<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>午餐決定輪盤</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.5.1/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/zarocknz/javascript-winwheel@2.8.0/Winwheel.min.js"></script>
  <style>
    body { text-align: center; font-family: sans-serif; }
    canvas { margin-top: 20px; }
    button { margin-top: 20px; font-size: 18px; padding: 10px 20px; }
  </style>
</head>
<body>
  <h2>🍱 午餐決定輪盤</h2>
  <canvas id="wheelcanvas" width="500" height="500"></canvas>
  <br>
  <button onclick="startSpin()">轉啊轉 🎯</button>
  <p id="result" style="font-size: 20px; margin-top: 20px;"></p>

  <script>
    let theWheel = new Winwheel({
      'canvasId': 'wheelcanvas',
      'numSegments': 15,
      'outerRadius': 230,
      'segments': [
   {'fillStyle': '#e67e22', 'text': '麥當勞'},
   {'fillStyle': '#2ecc71', 'text': '薩利亞'},
   {'fillStyle': '#3498db', 'text': '和民'},
   {'fillStyle': '#9b59b6', 'text': '壽司'},
   {'fillStyle': '#f1c40f', 'text': '洋庭坊'},
   {'fillStyle': '#1abc9c', 'text': '城中美食'},
   {'fillStyle': '#e74c3c', 'text': '餛飩麵'},
   {'fillStyle': '#34495e', 'text': '城中牛肉麵'},
   {'fillStyle': '#16a085', 'text': '海南雞飯'},
   {'fillStyle': '#c0392b', 'text': '拉亞'},
   {'fillStyle': '#2980b9', 'text': '麥味登'},
   {'fillStyle': '#8e44ad', 'text': '八方'},
   {'fillStyle': '#f39c12', 'text': '松屋'},
   {'fillStyle': '#7f8c8d', 'text': '好味燒臘'},
   {'fillStyle': '#27ae60', 'text': '新光地下街'}
      ],
      'animation': {
        'type': 'spinToStop',
        'duration': 5,
        'spins': 8,
        'callbackFinished': alertResult
      }
    });

    function startSpin() {
      theWheel.stopAnimation(false); 
      theWheel.rotationAngle = 0; 
      theWheel.draw(); 
      theWheel.startAnimation();
    }

    function alertResult(indicatedSegment) {
      document.getElementById('result').innerText = "今天吃：「" + indicatedSegment.text + "」🍽️";
    }
  </script>
</body>
</html>
